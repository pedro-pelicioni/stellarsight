# Runs what a reviewer would run, on the versions the project actually claims to support.
#
# The floor is Node 22 (package.json engines); the deployment runs 24. Testing both is the
# point: an engines field nobody exercises is a promise, and CONTRACT.md's "Node 22" was
# stated three different ways across the docs before anyone checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Conformance is only as good as its cadence: upstream can move the spec on a day
  # nobody pushes, so the same suite also runs on a nightly schedule.
  schedule:
    - cron: '0 6 * * *'

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    # Two store-transport tests skip themselves without a real Redis, so CI supplies one:
    # the round trip and the error-reply path are exactly the parts worth exercising
    # against a real server rather than a mock. The runs that stay skipped here by design
    # are the ones needing a live local stack — the agent's replay guard and the live
    # halves of the replay-naming suite, which want a facilitator on localhost:4021.
    # Booting the full stack inside CI would test the boot, not the guard; the nightly
    # settles against the deployment instead. Current shape: 276 tests, 0 failing.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test
        env:
          STELLARSIGHT_TEST_REDIS_URL: redis://127.0.0.1:6379

      # Drives the real api/discovery handlers with mock and real node req/res objects,
      # asserts every response shape, both pagination styles, CORS, the write path in all
      # four of its states, and the vercel.json rewrite ordering that keeps the SPA
      # catch-all from swallowing the API.
      - name: API conformance
        run: npm run verify:api

      # The claim that nothing in the production path is strong copyleft — the reason this
      # facilitator is self-hosted on @x402/stellar rather than built on the AGPL-3.0
      # OpenZeppelin Relayer — is argued in three documents. This is the step that makes it
      # a fact about the installed tree instead: enumerate production dependencies, read
      # each declared license, and fail the build if AGPL, SSPL, GPL or another strong
      # copyleft appears anywhere in the path.
      - name: Dependency licences permit redistribution
        run: npm run audit:licenses -- --emit --strict

      # Search quality is a number or it is an opinion. This runs the graded golden set in
      # eval/golden.jsonl through the real ranker and fails the build if nDCG@10,
      # Recall@20, MRR@10 or Precision@1 fall more than 0.02 below eval/baseline.json.
      # A ranking change that quietly costs relevance therefore cannot merge unnoticed:
      # it either keeps the numbers or updates the baseline on purpose, in the diff.
      - name: Search quality regression gate
        run: npm run eval:search

      # What Vercel builds. Catches a type error or a broken import before the deployment
      # does. The prebuild scripts reach Horizon and are written to never fail the build,
      # so a network blip degrades the data rather than the run.
      - name: Build the site
        run: npm run build --workspace apps/web

      # docs-site/ is a projection of the canonical markdown, never a hand-maintained copy
      # — scripts/sync-docs-site.mjs opens by saying so. Nothing enforced it, so a run that
      # rewrote docs/EVIDENCE.md and skipped the projection left the published docs site
      # quoting stale numbers: the precise drift the projection exists to prevent. Re-run
      # it and fail on any diff. Either the committed pages already match their sources, or
      # the diff names the sync someone forgot.
      - name: Docs site matches its sources
        run: |
          npm run docs:sync
          git diff --exit-code -- docs-site/

  contracts:
    name: cargo test (contracts/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Soroban crate under contracts/ is untouched by most PRs, and spinning up a
      # Rust toolchain isn't free — so this job skips its own steps unless contracts/**
      # changed. The nightly cron always runs it regardless of what changed, so a
      # soroban-sdk bump or a protocol update surfaces even on a day nobody touched the
      # crate.
      - name: Detect contracts/ changes
        id: filter
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contracts:
              - 'contracts/**'

      - name: Install Rust
        if: github.event_name == 'schedule' || steps.filter.outputs.contracts == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        if: github.event_name == 'schedule' || steps.filter.outputs.contracts == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: cargo test
        if: github.event_name == 'schedule' || steps.filter.outputs.contracts == 'true'
        working-directory: contracts
        run: cargo test --workspace
